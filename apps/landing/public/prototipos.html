<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipos · AMG</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/amg.css">
<style>
  .proto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
  .proto-backdrop{position:fixed;inset:0;z-index:60;background:rgba(9,22,36,.78);display:grid;place-items:center;padding:1rem}
  .proto-modal{width:min(1200px,100%);height:min(92vh,900px);background:#fff;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .proto-bar{display:flex;align-items:center;gap:1rem;padding:.7rem 1rem;border-bottom:1px solid #e3e8ef;flex:none}
  .proto-frame{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body data-page="prototipos">

<header data-topbar></header>

<main>
  <div class="wrap">
    <div id="prototipos"></div>
  </div>
</main>

<footer data-footer></footer>
<script src="/assets/amg.js" defer></script>
</body>
</html>
