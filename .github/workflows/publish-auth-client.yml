name: Publish auth-client

on:
  push:
    tags:
      - "auth-client-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@bentlyy"

      - name: Instalar dependencias
        run: npm ci

      - name: Construir @bentlyy/auth-client
        run: npm run build -w @bentlyy/auth-client

      - name: Publicar en GitHub Packages
        run: npm publish -w @bentlyy/auth-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empaquetar tarball
        run: npm pack -w @bentlyy/auth-client --pack-destination .

      - name: Adjuntar tarball al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/auth-client/package.json').version")
          TAG="auth-client-v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "auth-client v$VERSION" --notes "SDK de identidad AMG para los productos."
          fi
          gh release upload "$TAG" bentlyy-auth-client-*.tgz --clobber
